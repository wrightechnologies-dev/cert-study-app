<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <title> Cert Study App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="quiz">
    <h1>Cert Study App</h1>

    <div id="track-select">
    <p>Choose a track:</p>
    <button class="track-btn" data-track="cissp">CISSP</button>   
    <button class="track-btn" data-track="securityPlus">Security+</button>  
    <button class="track-btn" data-track="aPlus">A+</button>   
    <button class="track-btn" data-track="networkPlus">Network+</button> 
    <button class="track-btn" data-track="microsoft">SC-900</button>
    </div> 

    <div id="domain-select" style="display: none;">
    <p>Choose a domain:</p>
     <p id="version-note"></p>
    <div id="domain-buttons"></div>
    <button id="domain-back-btn">← Back to tracks</button>
    </div>

    <div id="primer-screen" style="display: none;">
      <h2 id="primer-title"></h2>
      <div id="primer-overview" class="primer-section" data-label="Overview"> </div>
      <div id="primer-why" class="primer-section" data-label="Why this domain matters"> </div>
      <div id="primer-tips" class="primer-section" data-label="Tips for this domain"> </div>
      <button id="primer-start-btn">Start quiz →</button>
      <button id="primer-back-btn">← Back to domains</button>
    </div>
    
    <div id="quiz-area">
    <p id="progress"></p>
    <p id="question">Question text loads here</p>

    <div id="answers">
      <button class="answer-btn">Answer A</button>
      <button class="answer-btn">Answer B</button>
      <button class="answer-btn">Answer C</button>
      <button class="answer-btn">Answer D</button>
    </div>

    <p id="feedback"></p>
    <p id="explanation"></p>
    <button id="next-btn">next</button>
    <div id="results-actions">
    <button id="restart-btn" style="display: none;"> Restart Quiz</button>
    <button id="new-quiz-btn" style="display: none;">Choose another quiz</button>
</div>

<script src="script.js"></script>
</body>
</html>
